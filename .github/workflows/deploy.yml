name: deploy website

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hugo 0.75.0 is pinned on purpose: the vendored Academic theme predates
      # the breaking changes in later releases. `extended` is required because
      # the theme compiles SCSS.
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: '0.75.0'
          extended: true

      - name: Build
        run: hugo

      - name: Add CNAME and .nojekyll
        run: |
          cp CNAME public/
          cp .nojekyll public/

      - name: Push to sentometricsresearch.github.io
        uses: cpina/github-action-push-to-another-repository@v1.7.3
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_GITHUB }}
        with:
          source-directory: 'public'
          destination-github-username: 'SentometricsResearch'
          destination-repository-name: 'sentometricsresearch.github.io'
          user-email: keven.bluteau@hec.ca
          target-branch: master
